<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VibeCraft Mobile</title>
    <style>
        * { 
            touch-action: none; 
            user-select: none; 
            -webkit-user-select: none; 
            box-sizing: border-box; 
        }
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: #111; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        
        /* UI OVERLAY MENUS */
        .overlay { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            background: rgba(18, 18, 24, 0.94); 
            color: white; 
            z-index: 100; 
            padding: 20px; 
        }
        .hidden { display: none !important; }
        
        h1 { 
            font-size: 36px; 
            margin-bottom: 20px; 
            color: #55a02e; 
            text-shadow: 2px 2px #000; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
        }
        .menu-box { 
            width: 100%; 
            max-width: 340px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        
        label { font-size: 14px; color: #aaa; margin-bottom: -6px; }
        input[type="text"], input[type="number"], select { 
            width: 100%; 
            padding: 12px; 
            border-radius: 8px; 
            border: 2px solid #333; 
            background: #222; 
            color: #fff; 
            font-size: 16px; 
            outline: none; 
            text-align: center; 
        }
        input[type="text"]:focus, select:focus { border-color: #55a02e; }
        
        .btn { 
            width: 100%; 
            padding: 14px; 
            border: none; 
            border-radius: 8px; 
            background: #55a02e; 
            color: white; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            text-shadow: 1px 1px #000; 
            box-shadow: 0 4px #3b731f; 
        }
        .btn:active { transform: translateY(3px); box-shadow: 0 1px #3b731f; }
        .btn-secondary { background: #444; box-shadow: 0 4px #222; }

        .code-display { 
            font-size: 32px; 
            font-weight: bold; 
            letter-spacing: 6px; 
            color: #ffca28; 
            background: #222; 
            padding: 12px; 
            border-radius: 8px; 
            text-align: center; 
            border: 2px dashed #ffca28; 
            margin: 10px 0; 
        }
        .status-msg { 
            font-size: 13px; 
            color: #4caf50; 
            text-align: center; 
            min-height: 24px; 
            word-break: break-word; 
            padding: 4px;
        }

        /* DIAGNOSTIC / ERROR MODAL */
        #error-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .error-card {
            background: #1e1e24;
            border: 2px solid #ff5252;
            border-radius: 12px;
            padding: 20px;
            max-width: 360px;
            width: 100%;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .error-card h2 { color: #ff5252; margin-top: 0; font-size: 20px; }
        .error-card p { font-size: 13px; line-height: 1.5; color: #ccc; white-space: pre-line; }
        .error-card ul { font-size: 12px; padding-left: 20px; color: #aaa; }

        /* HUD & TOUCH CONTROLS */
        #crosshair { 
            position: absolute; 
            top: 40%; 
            left: 50%; 
            width: 8px; 
            height: 8px; 
            background: rgba(255,255,255,0.8); 
            border-radius: 50%; 
            transform: translate(-50%, -50%); 
            pointer-events: none; 
            z-index: 10; 
        }
        #look-zone { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 70%; 
            z-index: 5; 
        }
        #controls-zone { 
            position: absolute; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            height: 30%; 
            z-index: 10; 
            pointer-events: none; 
        }
        
        #joystick-base { 
            position: absolute; 
            bottom: 40px; 
            left: 40px; 
            width: 120px; 
            height: 120px; 
            background: rgba(255, 255, 255, 0.2); 
            border: 2px solid rgba(255, 255, 255, 0.5); 
            border-radius: 50%; 
            pointer-events: auto; 
        }
        #joystick-knob { 
            position: absolute; 
            top: 35px; 
            left: 35px; 
            width: 50px; 
            height: 50px; 
            background: rgba(255, 255, 255, 0.7); 
            border-radius: 50%; 
        }
        #btn-jump { 
            position: absolute; 
            bottom: 50px; 
            right: 40px; 
            width: 80px; 
            height: 80px; 
            background: rgba(255, 255, 255, 0.3); 
            border: 2px solid white; 
            border-radius: 50%; 
            color: white; 
            font-weight: bold; 
            font-size: 28px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            pointer-events: auto; 
        }
        
        #player-tag { 
            position: absolute; 
            top: 15px; 
            left: 15px; 
            background: rgba(0,0,0,0.6); 
            color: white; 
            padding: 6px 12px; 
            border-radius: 20px; 
            font-size: 14px; 
            z-index: 10; 
        }
    </style>
</head>
<body>

    <!-- HUD -->
    <div id="crosshair"></div>
    <div id="look-zone"></div>
    <div id="player-tag">Player: Guest</div>
    <div id="controls-zone">
        <div id="joystick-base"><div id="joystick-knob"></div></div>
        <div id="btn-jump">▲</div>
    </div>

    <!-- DIAGNOSTIC ERROR MODAL -->
    <div id="error-modal" class="hidden">
        <div class="error-card">
            <h2 id="error-title">⚠️ Connection Error</h2>
            <p id="error-body">Unable to establish connection.</p>
            <button class="btn" style="margin-top:15px;" onclick="closeError()">Close & Retry</button>
        </div>
    </div>

    <!-- MAIN MENU -->
    <div id="menu-main" class="overlay">
        <h1>VibeCraft</h1>
        <div class="menu-box">
            <label>Player Name</label>
            <input type="text" id="username" value="Steve" maxlength="12">
            
            <button class="btn" id="btn-play-menu">PLAY</button>
            <button class="btn btn-secondary" id="btn-settings-menu">SETTINGS</button>
        </div>
    </div>

    <!-- PLAY SUB-MENU -->
    <div id="menu-play" class="overlay hidden">
        <h1>Select Mode</h1>
        <div class="menu-box">
            <button class="btn" id="btn-mode-single">Single Player</button>
            <button class="btn" id="btn-mode-host">Host Game</button>
            <button class="btn" id="btn-mode-join">Join Game</button>
            <button class="btn btn-secondary" id="btn-back-main">Back</button>
        </div>
    </div>

    <!-- HOST ROOM MENU -->
    <div id="menu-host" class="overlay hidden">
        <h1>Hosting Game</h1>
        <div class="menu-box">
            <label>Give this 6-Digit Code to your friend:</label>
            <div id="host-code" class="code-display">------</div>
            <div id="host-status" class="status-msg">Connecting to Hugging Face...</div>
            <button class="btn" id="btn-start-host">Start & Play</button>
            <button class="btn btn-secondary" id="btn-back-play1">Back</button>
        </div>
    </div>

    <!-- JOIN ROOM MENU -->
    <div id="menu-join" class="overlay hidden">
        <h1>Join Game</h1>
        <div class="menu-box">
            <label>Enter Friend's 6-Digit Code</label>
            <input type="number" id="join-code" placeholder="123456">
            <div id="join-status" class="status-msg"></div>
            <button class="btn" id="btn-start-join">Connect & Play</button>
            <button class="btn btn-secondary" id="btn-back-play2">Back</button>
        </div>
    </div>

    <!-- SETTINGS MENU -->
    <div id="menu-settings" class="overlay hidden">
        <h1>Settings</h1>
        <div class="menu-box">
            <label>Render Distance</label>
            <select id="setting-render">
                <option value="32">32x32 (Fast)</option>
                <option value="48">48x48 (Medium)</option>
                <option value="64" selected>64x64 (High)</option>
            </select>

            <label>Look Sensitivity</label>
            <select id="setting-sens">
                <option value="0.003">Low</option>
                <option value="0.005" selected>Medium</option>
                <option value="0.008">High</option>
            </select>

            <button class="btn" id="btn-save-settings">Save</button>
        </div>
    </div>

    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
      }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // Direct WebSocket endpoint for Hugging Face Spaces
        const HF_SERVER_URL = "wss://seraj-develops-minecraft-server.hf.space";

        let worldSize = 64;
        let cameraSens = 0.005;
        let playerName = "Steve";
        let roomCode = "";
        let ws = null;
        let otherPlayers = {};

        // UI Helpers
        const ui = {
            main: document.getElementById('menu-main'),
            play: document.getElementById('menu-play'),
            host: document.getElementById('menu-host'),
            join: document.getElementById('menu-join'),
            settings: document.getElementById('menu-settings'),
            tag: document.getElementById('player-tag'),
            errModal: document.getElementById('error-modal'),
            errTitle: document.getElementById('error-title'),
            errBody: document.getElementById('error-body')
        };

        window.closeError = () => ui.errModal.classList.add('hidden');

        function showError(title, details) {
            ui.errTitle.innerText = title;
            ui.errBody.innerText = details;
            ui.errModal.classList.remove('hidden');
        }

        const showMenu = (menu) => {
            [ui.main, ui.play, ui.host, ui.join, ui.settings].forEach(m => m.classList.add('hidden'));
            if(menu) menu.classList.remove('hidden');
        };

        document.getElementById('btn-play-menu').onclick = () => showMenu(ui.play);
        document.getElementById('btn-settings-menu').onclick = () => showMenu(ui.settings);
        document.getElementById('btn-back-main').onclick = () => showMenu(ui.main);
        document.getElementById('btn-back-play1').onclick = () => showMenu(ui.play);
        document.getElementById('btn-back-play2').onclick = () => showMenu(ui.play);

        // --- ENHANCED WEBSOCKET CONNECTION & DIAGNOSTICS ---
        function connectWebSocket(url, code, statusElementId, onConnectSuccess) {
            const statusEl = document.getElementById(statusElementId);
            if(statusEl) statusEl.innerText = "⏳ Initiating Handshake...";

            if(ws) {
                ws.close();
                ws = null;
            }

            // 7-Second Timeout Detector
            const timeoutTimer = setTimeout(() => {
                if(!ws || ws.readyState !== WebSocket.OPEN) {
                    if(statusEl) statusEl.innerText = "❌ Connection Timed Out";
                    showError(
                        "⌛ Server Timeout",
                        `Could not connect to server in time:\n${url}\n\n` +
                        `Most Likely Causes:\n` +
                        `1. Your Hugging Face Space is set to PRIVATE (Set to PUBLIC in Space Settings).\n` +
                        `2. Space is building/sleeping on Hugging Face.\n` +
                        `3. File named 'App.py' instead of 'app.py' (case sensitivity issue).`
                    );
                }
            }, 7000);

            try {
                ws = new WebSocket(url);

                ws.onopen = () => {
                    clearTimeout(timeoutTimer);
                    if(statusEl) statusEl.innerText = "✅ Connected to Server!";
                    ws.send(JSON.stringify({ type: 'join', code: code, name: playerName }));
                    if(onConnectSuccess) onConnectSuccess();
                };

                ws.onmessage = (msg) => {
                    try {
                        const data = JSON.parse(msg.data);
                        if(data.type === 'player_move') updateRemotePlayer(data);
                    } catch(e) {}
                };

                ws.onerror = (err) => {
                    clearTimeout(timeoutTimer);
                    if(statusEl) statusEl.innerText = "❌ WebSocket Failed";
                    console.error("WS Diagnostic Error:", err);
                    showError(
                        "🔌 Connection Failed",
                        `Failed to open WebSocket stream to:\n${url}\n\n` +
                        `Checklist:\n` +
                        `• Open HF Space Settings and check 'Space Visibility' is PUBLIC.\n` +
                        `• Check HF Space status is green 'Running'.`
                    );
                };

                ws.onclose = (evt) => {
                    clearTimeout(timeoutTimer);
                    if(evt.code !== 1000) {
                        if(statusEl) statusEl.innerText = `❌ Disconnected (Code ${evt.code})`;
                        showError(
                            `Disconnected (Code ${evt.code})`,
                            `Server closed connection unexpectedly.\n` +
                            `Reason: ${evt.reason || 'Abnormal Close (Usually Private Space or Server Crash)'}`
                        );
                    }
                };

            } catch(e) {
                clearTimeout(timeoutTimer);
                if(statusEl) statusEl.innerText = "❌ Setup Exception";
                showError("Client Error", e.message);
            }
        }

        // --- HOST & JOIN BUTTONS ---
        document.getElementById('btn-mode-host').onclick = () => {
            roomCode = Math.floor(100000 + Math.random() * 900000).toString();
            document.getElementById('host-code').innerText = roomCode;
            showMenu(ui.host);

            connectWebSocket(HF_SERVER_URL, roomCode, 'host-status');
        };

        document.getElementById('btn-mode-join').onclick = () => showMenu(ui.join);

        document.getElementById('btn-start-join').onclick = () => {
            const code = document.getElementById('join-code').value;
            if(!code || code.length !== 6) {
                document.getElementById('join-status').innerText = "⚠️ Enter 6-digit code!";
                return;
            }
            
            connectWebSocket(HF_SERVER_URL, code, 'join-status', () => {
                startGame();
            });
        };

        document.getElementById('btn-mode-single').onclick = () => startGame();
        document.getElementById('btn-start-host').onclick = () => startGame();

        document.getElementById('btn-save-settings').onclick = () => {
            worldSize = parseInt(document.getElementById('setting-render').value);
            cameraSens = parseFloat(document.getElementById('setting-sens').value);
            showMenu(ui.main);
        };

        function startGame() {
            playerName = document.getElementById('username').value || "Steve";
            ui.tag.innerText = "Player: " + playerName;
            showMenu(null);
            initGame();
        }

        // --- PROCEDURAL TEXTURES & THREE.JS LOGIC ---
        function createPixelTexture(draw) {
            const canvas = document.createElement('canvas');
            canvas.width = 16; canvas.height = 16;
            const ctx = canvas.getContext('2d');
            draw(ctx);
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter;
            tex.minFilter = THREE.NearestFilter;
            return tex;
        }

        const grassTopTex = createPixelTexture(ctx => {
            ctx.fillStyle = '#55a02e'; ctx.fillRect(0, 0, 16, 16);
            for(let i=0; i<30; i++) { ctx.fillStyle = '#488b25'; ctx.fillRect(Math.random()*16, Math.random()*16, 1, 1); }
        });
        const dirtTex = createPixelTexture(ctx => {
            ctx.fillStyle = '#866043'; ctx.fillRect(0, 0, 16, 16);
            for(let i=0; i<30; i++) { ctx.fillStyle = '#684831'; ctx.fillRect(Math.random()*16, Math.random()*16, 1, 1); }
        });
        const grassSideTex = createPixelTexture(ctx => {
            ctx.fillStyle = '#866043'; ctx.fillRect(0, 0, 16, 16);
            ctx.fillStyle = '#55a02e'; ctx.fillRect(0, 0, 16, 4);
        });
        const stoneTex = createPixelTexture(ctx => {
            ctx.fillStyle = '#737373'; ctx.fillRect(0, 0, 16, 16);
            for(let i=0; i<30; i++) { ctx.fillStyle = '#525252'; ctx.fillRect(Math.random()*16, Math.random()*16, 1, 1); }
        });

        const grassMat = [
            new THREE.MeshLambertMaterial({ map: grassSideTex }),
            new THREE.MeshLambertMaterial({ map: grassSideTex }),
            new THREE.MeshLambertMaterial({ map: grassTopTex }),
            new THREE.MeshLambertMaterial({ map: dirtTex }),
            new THREE.MeshLambertMaterial({ map: grassSideTex }),
            new THREE.MeshLambertMaterial({ map: grassSideTex })
        ];
        const dirtMat = new THREE.MeshLambertMaterial({ map: dirtTex });
        const stoneMat = new THREE.MeshLambertMaterial({ map: stoneTex });

        let scene, camera, renderer;

        function getTerrainHeight(x, z) {
            let h = Math.sin(x * 0.05) * Math.cos(z * 0.05) * 6;
            h += Math.sin(x * 0.02 + z * 0.02) * 8;
            return Math.floor(h) + 8;
        }

        function initGame() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, worldSize * 0.4, worldSize * 0.8);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 150);
            camera.rotation.order = "YXZ";

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const sun = new THREE.DirectionalLight(0xffffff, 0.8);
            sun.position.set(30, 60, 30);
            scene.add(sun);

            const geom = new THREE.BoxGeometry(1, 1, 1);
            const matrix = new THREE.Matrix4();

            const grassMesh = new THREE.InstancedMesh(geom, grassMat, worldSize * worldSize);
            const dirtMesh = new THREE.InstancedMesh(geom, dirtMat, worldSize * worldSize * 3);
            const stoneMesh = new THREE.InstancedMesh(geom, stoneMat, worldSize * worldSize * 6);

            let gIdx = 0, dIdx = 0, sIdx = 0;
            for (let x = 0; x < worldSize; x++) {
                for (let z = 0; z < worldSize; z++) {
                    const wx = x - worldSize / 2;
                    const wz = z - worldSize / 2;
                    const sy = getTerrainHeight(wx, wz);

                    matrix.setPosition(wx, sy, wz); grassMesh.setMatrixAt(gIdx++, matrix);
                    for (let y = sy - 1; y >= sy - 2; y--) { matrix.setPosition(wx, y, wz); dirtMesh.setMatrixAt(dIdx++, matrix); }
                    for (let y = sy - 3; y >= 0; y--) { matrix.setPosition(wx, y, wz); stoneMesh.setMatrixAt(sIdx++, matrix); }
                }
            }
            scene.add(grassMesh); scene.add(dirtMesh); scene.add(stoneMesh);

            camera.position.set(0, getTerrainHeight(0, 0) + 3, 0);

            setupControls();
            animate();
        }

        // --- CONTROLS & PHYSICS ---
        let moveX = 0, moveZ = 0, isJumping = false;
        let yaw = 0, pitch = 0;

        function setupControls() {
            const base = document.getElementById('joystick-base');
            const knob = document.getElementById('joystick-knob');
            let joyId = null, center = { x: 0, y: 0 };

            base.ontouchstart = (e) => {
                const t = e.changedTouches[0];
                joyId = t.identifier;
                const r = base.getBoundingClientRect();
                center = { x: r.left + r.width/2, y: r.top + r.height/2 };
            };

            window.ontouchmove = (e) => {
                for(let t of e.changedTouches) {
                    if(t.identifier === joyId) {
                        let dx = t.clientX - center.x, dy = t.clientY - center.y;
                        const dist = Math.hypot(dx, dy);
                        if(dist > 40) { dx = (dx/dist)*40; dy = (dy/dist)*40; }
                        knob.style.transform = `translate(${dx}px, ${dy}px)`;
                        moveX = dx / 40; moveZ = dy / 40;
                    }
                }
            };

            window.ontouchend = (e) => {
                for(let t of e.changedTouches) {
                    if(t.identifier === joyId) { joyId = null; moveX = 0; moveZ = 0; knob.style.transform = 'translate(0,0)'; }
                }
            };

            document.getElementById('btn-jump').ontouchstart = (e) => { e.preventDefault(); isJumping = true; };
            document.getElementById('btn-jump').ontouchend = () => isJumping = false;

            const look = document.getElementById('look-zone');
            let lookId = null, lx = 0, ly = 0;
            look.ontouchstart = (e) => { const t = e.changedTouches[0]; lookId = t.identifier; lx = t.clientX; ly = t.clientY; };
            window.ontouchmove = (e) => {
                for(let t of e.changedTouches) {
                    if(t.identifier === lookId) {
                        yaw -= (t.clientX - lx) * cameraSens;
                        pitch -= (t.clientY - ly) * cameraSens;
                        pitch = Math.max(-Math.PI/2.1, Math.min(Math.PI/2.1, pitch));
                        camera.rotation.y = yaw; camera.rotation.x = pitch;
                        lx = t.clientX; ly = t.clientY;
                    }
                }
            };
            window.ontouchend = (e) => { for(let t of e.changedTouches) if(t.identifier === lookId) lookId = null; };
        }

        function updateRemotePlayer(data) {
            if(!otherPlayers[data.id]) {
                const geom = new THREE.BoxGeometry(0.8, 1.8, 0.8);
                const mat = new THREE.MeshLambertMaterial({ color: 0x3388ff });
                const mesh = new THREE.Mesh(geom, mat);
                scene.add(mesh);
                otherPlayers[data.id] = mesh;
            }
            otherPlayers[data.id].position.set(data.x, data.y, data.z);
        }

        const vel = new THREE.Vector3();
        let prevTime = performance.now(), canJump = false;

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1);

            vel.x -= vel.x * 10.0 * delta; vel.z -= vel.z * 10.0 * delta; vel.y -= 9.8 * 5.0 * delta;

            const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
            const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

            if (moveZ !== 0) { vel.x -= forward.x * moveZ * 35.0 * delta; vel.z -= forward.z * moveZ * 35.0 * delta; }
            if (moveX !== 0) { vel.x += right.x * moveX * 35.0 * delta; vel.z += right.z * moveX * 35.0 * delta; }

            camera.position.x += vel.x * delta; camera.position.z += vel.z * delta; camera.position.y += vel.y * delta;

            const groundY = getTerrainHeight(camera.position.x, camera.position.z) + 2.5;
            if (camera.position.y < groundY) { vel.y = 0; camera.position.y = groundY; canJump = true; }
            if (isJumping && canJump) { vel.y = 14; canJump = false; }

            if(ws && ws.readyState === WebSocket.OPEN && Math.random() < 0.2) {
                ws.send(JSON.stringify({
                    type: 'move', code: roomCode,
                    x: camera.position.x, y: camera.position.y, z: camera.position.z
                }));
            }

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
