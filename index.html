<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VibeCraft Mobile</title>
    <style>
        * { touch-action: none; user-select: none; -webkit-user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #87CEEB; font-family: sans-serif; }
        
        #crosshair { position: absolute; top: 40%; left: 50%; width: 8px; height: 8px; background: rgba(255,255,255,0.8); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; }
        
        /* Touch Zone to Look Around (Upper 70% of screen) */
        #look-zone { position: absolute; top: 0; left: 0; width: 100%; height: 70%; z-index: 5; }

        /* Controls Area (Bottom 30% of screen) */
        #controls-zone { position: absolute; bottom: 0; left: 0; width: 100%; height: 30%; z-index: 10; pointer-events: none; }

        /* Joystick Styling */
        #joystick-base { position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px; background: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255, 255, 255, 0.5); border-radius: 50%; pointer-events: auto; }
        #joystick-knob { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(255, 255, 255, 0.7); border-radius: 50%; transition: transform 0.05s ease-out; }

        /* Jump Button */
        #btn-jump { position: absolute; bottom: 50px; right: 40px; width: 80px; height: 80px; background: rgba(255, 255, 255, 0.3); border: 2px solid white; border-radius: 50%; color: white; font-weight: bold; font-size: 28px; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
        #btn-jump:active { background: rgba(255, 255, 255, 0.7); }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="look-zone"></div>
    
    <div id="controls-zone">
        <div id="joystick-base">
            <div id="joystick-knob"></div>
        </div>
        <div id="btn-jump">▲</div>
    </div>

    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
      }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // -----------------------------------------------------------------
        // 1. PROCEDURAL 16x16 PIXEL TEXTURE GENERATOR
        // -----------------------------------------------------------------
        function createPixelTexture(drawPixelArt) {
            const canvas = document.createElement('canvas');
            canvas.width = 16;
            canvas.height = 16;
            const ctx = canvas.getContext('2d');
            drawPixelArt(ctx);
            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter; // Sharp pixel rendering
            texture.minFilter = THREE.NearestFilter;
            return texture;
        }

        const grassTopTex = createPixelTexture(ctx => {
            ctx.fillStyle = '#55a02e'; ctx.fillRect(0, 0, 16, 16);
            for(let i=0; i<40; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#488b25' : '#63b236';
                ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 1, 1);
            }
        });

        const dirtTex = createPixelTexture(ctx => {
            ctx.fillStyle = '#866043'; ctx.fillRect(0, 0, 16, 16);
            for(let i=0; i<40; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#684831' : '#9c7353';
                ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 1, 1);
            }
        });

        const grassSideTex = createPixelTexture(ctx => {
            // Dirt base
            ctx.fillStyle = '#866043'; ctx.fillRect(0, 0, 16, 16);
            for(let i=0; i<30; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#684831' : '#9c7353';
                ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 1, 1);
            }
            // Grass top strip
            ctx.fillStyle = '#55a02e'; ctx.fillRect(0, 0, 16, 4);
            for(let x=0; x<16; x++) {
                if(Math.random() > 0.4) ctx.fillRect(x, 4, 1, Math.floor(Math.random()*3));
            }
        });

        const stoneTex = createPixelTexture(ctx => {
            ctx.fillStyle = '#737373'; ctx.fillRect(0, 0, 16, 16);
            for(let i=0; i<40; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#525252' : '#8e8e8e';
                ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 1, 1);
            }
        });

        // Block Material Definitions
        const grassBlockMaterials = [
            new THREE.MeshLambertMaterial({ map: grassSideTex }),
            new THREE.MeshLambertMaterial({ map: grassSideTex }),
            new THREE.MeshLambertMaterial({ map: grassTopTex }),
            new THREE.MeshLambertMaterial({ map: dirtTex }),
            new THREE.MeshLambertMaterial({ map: grassSideTex }),
            new THREE.MeshLambertMaterial({ map: grassSideTex })
        ];
        const dirtMaterial = new THREE.MeshLambertMaterial({ map: dirtTex });
        const stoneMaterial = new THREE.MeshLambertMaterial({ map: stoneTex });

        // -----------------------------------------------------------------
        // 2. SCENE & CAMERA SETUP
        // -----------------------------------------------------------------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 15, 45);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.rotation.order = "YXZ"; 

        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const sun = new THREE.DirectionalLight(0xffffff, 0.8);
        sun.position.set(20, 50, 20);
        scene.add(sun);

        // -----------------------------------------------------------------
        // 3. NOISE ENGINE & TERRAIN GENERATION
        // -----------------------------------------------------------------
        function getTerrainHeight(x, z) {
            // Multi-octave Sine Noise algorithm for organic hills
            let h = Math.sin(x * 0.08) * Math.cos(z * 0.08) * 4;
            h += Math.sin(x * 0.03 + z * 0.03) * 6;
            h += Math.cos(x * 0.15 - z * 0.15) * 2;
            return Math.floor(h) + 6; // Base ground height
        }

        const worldSize = 32;
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const matrix = new THREE.Matrix4();

        // Calculate maximum blocks needed
        let grassCount = worldSize * worldSize;
        let dirtCount = worldSize * worldSize * 3;
        let stoneCount = worldSize * worldSize * 8;

        const grassMesh = new THREE.InstancedMesh(geometry, grassBlockMaterials, grassCount);
        const dirtMesh = new THREE.InstancedMesh(geometry, dirtMaterial, dirtCount);
        const stoneMesh = new THREE.InstancedMesh(geometry, stoneMaterial, stoneCount);

        let gIdx = 0, dIdx = 0, sIdx = 0;

        for (let x = 0; x < worldSize; x++) {
            for (let z = 0; z < worldSize; z++) {
                const worldX = x - worldSize / 2;
                const worldZ = z - worldSize / 2;
                const surfaceY = getTerrainHeight(worldX, worldZ);

                // Top layer: Grass
                matrix.setPosition(worldX, surfaceY, worldZ);
                grassMesh.setMatrixAt(gIdx++, matrix);

                // Middle layers: Dirt
                for (let y = surfaceY - 1; y >= surfaceY - 3; y--) {
                    matrix.setPosition(worldX, y, worldZ);
                    dirtMesh.setMatrixAt(dIdx++, matrix);
                }

                // Deep layers: Stone
                for (let y = surfaceY - 4; y >= 0; y--) {
                    matrix.setPosition(worldX, y, worldZ);
                    stoneMesh.setMatrixAt(sIdx++, matrix);
                }
            }
        }

        scene.add(grassMesh);
        scene.add(dirtMesh);
        scene.add(stoneMesh);

        // Spawn player above highest block at map center
        const spawnY = getTerrainHeight(0, 0) + 3;
        camera.position.set(0, spawnY, 0);

        // -----------------------------------------------------------------
        // 4. TOUCH CONTROLS (JOYSTICK & LOOK ENGINE)
        // -----------------------------------------------------------------
        let moveX = 0, moveZ = 0;
        let isJumping = false;

        // Joystick Logic
        const base = document.getElementById('joystick-base');
        const knob = document.getElementById('joystick-knob');
        let joyTouchId = null;
        let baseCenter = { x: 0, y: 0 };

        base.addEventListener('touchstart', (e) => {
            const touch = e.changedTouches[0];
            joyTouchId = touch.identifier;
            const rect = base.getBoundingClientRect();
            baseCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
            updateJoystick(touch);
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === joyTouchId) updateJoystick(touch);
            }
        }, { passive: false });

        const resetJoystick = (e) => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === joyTouchId) {
                    joyTouchId = null;
                    moveX = 0; moveZ = 0;
                    knob.style.transform = `translate(0px, 0px)`;
                }
            }
        };
        window.addEventListener('touchend', resetJoystick);
        window.addEventListener('touchcancel', resetJoystick);

        function updateJoystick(touch) {
            const maxRadius = 40;
            let dx = touch.clientX - baseCenter.x;
            let dy = touch.clientY - baseCenter.y;
            const dist = Math.hypot(dx, dy);

            if (dist > maxRadius) {
                dx = (dx / dist) * maxRadius;
                dy = (dy / dist) * maxRadius;
            }

            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            moveX = dx / maxRadius;  // Output range -1.0 to 1.0
            moveZ = dy / maxRadius;
        }

        // Jump Button
        const jumpBtn = document.getElementById('btn-jump');
        jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); isJumping = true; });
        jumpBtn.addEventListener('touchend', () => isJumping = false);

        // Camera Drag Look Logic
        const lookZone = document.getElementById('look-zone');
        let lookTouchId = null;
        let lastTouchX = 0, lastTouchY = 0;
        let yaw = 0, pitch = 0;

        lookZone.addEventListener('touchstart', (e) => {
            const touch = e.changedTouches[0];
            lookTouchId = touch.identifier;
            lastTouchX = touch.clientX;
            lastTouchY = touch.clientY;
        });

        window.addEventListener('touchmove', (e) => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === lookTouchId) {
                    const dx = touch.clientX - lastTouchX;
                    const dy = touch.clientY - lastTouchY;

                    yaw -= dx * 0.005;
                    pitch -= dy * 0.005;
                    pitch = Math.max(-Math.PI / 2.1, Math.min(Math.PI / 2.1, pitch));

                    camera.rotation.y = yaw;
                    camera.rotation.x = pitch;

                    lastTouchX = touch.clientX;
                    lastTouchY = touch.clientY;
                }
            }
        });

        const resetLook = (e) => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === lookTouchId) lookTouchId = null;
            }
        };
        window.addEventListener('touchend', resetLook);

        // -----------------------------------------------------------------
        // 5. PHYSICS ENGINE & GAME LOOP
        // -----------------------------------------------------------------
        const velocity = new THREE.Vector3();
        let prevTime = performance.now();
        let canJump = false;

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1);

            // Apply friction & gravity
            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;
            velocity.y -= 9.8 * 5.0 * delta;

            // Camera movement relative to look direction
            const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
            const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

            // Apply joystick vector
            if (moveZ !== 0) {
                velocity.x -= forward.x * moveZ * 35.0 * delta;
                velocity.z -= forward.z * moveZ * 35.0 * delta;
            }
            if (moveX !== 0) {
                velocity.x += right.x * moveX * 35.0 * delta;
                velocity.z += right.z * moveX * 35.0 * delta;
            }

            camera.position.x += velocity.x * delta;
            camera.position.z += velocity.z * delta;
            camera.position.y += velocity.y * delta;

            // Ground Collision based on Noise Heightmap
            const currentTerrainY = getTerrainHeight(camera.position.x, camera.position.z) + 2.5;
            if (camera.position.y < currentTerrainY) {
                velocity.y = 0;
                camera.position.y = currentTerrainY;
                canJump = true;
            }

            if (isJumping && canJump) {
                velocity.y = 14;
                canJump = false;
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
