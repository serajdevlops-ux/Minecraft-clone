name: Build Minecraft APK

on:
  push:
    branches: [ "main", "master" ] 

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Files & Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          
          mkdir -p www
          
          if ls | grep -iq '^index\.html$'; then
            cp -f $(ls | grep -i '^index\.html$') www/index.html
          else
            echo "ERROR: index.html not found in the repository root!"
            exit 1
          fi
          
          npx cap init VibeCraft com.vibe.minecraft --web-dir www
          npx cap add android
          
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
